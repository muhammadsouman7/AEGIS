<!DOCTYPE html>
<html>
<head>
  <title>AEGIS</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #111; color: #fff; }
    video { width: 100%; border-radius: 10px; }
    button { padding: 12px 20px; margin: 8px; font-size: 16px; }
  </style>
</head>
<body>
  <h2>AEGIS Live</h2>

  <div style="position: relative; max-width: 500px; margin: auto;">
    <video id="video" autoplay playsinline style="width:100%; border-radius:10px;"></video>
    <canvas id="overlay" style="position:absolute; top:0; left:0; width:100%; height:100%;"></canvas>
  </div>

  <br>
  <button onclick="setMode('detect')">Obstacle Alert</button>
  <button onclick="setMode('read_text')">Read Text</button>
  <button onclick="promptFind()">Find Object</button>
  <p id="status">Mode: detect</p>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('status').innerText = "ERROR: " + msg;
    };

    const BACKEND_URL = "https://d0f7-34-16-188-189.ngrok-free.app"; // UPDATE with your current ngrok URL

    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');

    const captureCanvas = document.createElement('canvas');
    const captureCtx = captureCanvas.getContext('2d');

    let mode = 'detect';
    let target = '';

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then(stream => {
        video.srcObject = stream;
        video.onloadedmetadata = () => {
          overlay.width = video.videoWidth;
          overlay.height = video.videoHeight;
        };
      });

    function setMode(m) {
      mode = m;
      document.getElementById('status').innerText = "Mode: " + m;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      lastCategory = 'none'; // reset so new mode speaks fresh
      lastSteps = null;
    }

    function promptFind() {
      target = prompt("What object are you looking for?");
      mode = 'find_object';
      document.getElementById('status').innerText = "Finding: " + target;
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      lastCategory = 'none';
      lastSteps = null;
    }

    // ===== Speak logic: only speaks on category change, big distance change, or urgency =====
    let lastCategory = 'none';
    let lastSteps = null;
    let lastSpeakTime = 0;
    const SAFETY_TIMEOUT = 10000; // re-remind after 10s of silence even if unchanged

    function speak(text, isUrgent, category, steps) {
      const now = Date.now();
      const categoryChanged = category !== lastCategory;
      const gotSignificantlyCloser = (
        lastSteps !== null && steps !== null && (lastSteps - steps) >= 3
      );
      const safetyTimeoutPassed = now - lastSpeakTime > SAFETY_TIMEOUT;

      if (isUrgent || categoryChanged || gotSignificantlyCloser || safetyTimeoutPassed) {
        speakImmediate(text);
        lastCategory = category;
        lastSteps = steps;
        lastSpeakTime = now;
      }
    }

    function speakImmediate(text) {
      if (recognition) recognition.stop();
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.onend = () => { if (isListening && recognition) recognition.start(); };
      window.speechSynthesis.speak(utter);
    }

    // ===== Always-listening wake word =====
    let recognition;
    let isListening = false;

    function initAlwaysListening() {
      recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
      recognition.lang = 'en-US';
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onresult = (event) => {
        const last = event.results.length - 1;
        const transcript = event.results[last][0].transcript.toLowerCase().trim();
        console.log("Heard:", transcript);

        if (transcript.includes("hey aegis") || transcript.includes("hey egis")) {
          const command = transcript.split(/hey aegis|hey egis/)[1]?.trim();
          if (command) {
            handleWakeCommand(command);
          } else {
            speakImmediate("Yes, I'm listening");
          }
        }
      };

      recognition.onerror = (event) => {
        console.log("Speech recognition error:", event.error);
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };

      isListening = true;
      recognition.start();
      document.getElementById('status').innerText = "Listening for 'Hey AEGIS'...";
    }

    async function handleWakeCommand(command) {
      document.getElementById('status').innerText = `Command: "${command}"`;

      const res = await fetch(`${BACKEND_URL}/parse_intent`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify({ text: command })
      });
      const data = await res.json();

      mode = data.mode;
      target = data.target || '';
      lastCategory = 'none';
      lastSteps = null;
      document.getElementById('status').innerText = `Mode: ${mode}${target ? ' (' + target + ')' : ''}`;
      speakImmediate(`Mode set to ${mode.replace('_', ' ')}${target ? ', looking for ' + target : ''}`);
    }

    // ===== Bounding box drawing =====
    function drawBoxes(boxes, frameW, frameH) {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      if (!boxes || !frameW || !frameH) return;

      const scaleX = overlay.width / frameW;
      const scaleY = overlay.height / frameH;

      boxes.forEach(box => {
        const x = box.x1 * scaleX;
        const y = box.y1 * scaleY;
        const w = (box.x2 - box.x1) * scaleX;
        const h = (box.y2 - box.y1) * scaleY;

        overlayCtx.strokeStyle = "#00FF00";
        overlayCtx.lineWidth = 3;
        overlayCtx.strokeRect(x, y, w, h);

        overlayCtx.fillStyle = "#00FF00";
        overlayCtx.font = "16px sans-serif";
        overlayCtx.fillText(box.label, x, y > 20 ? y - 5 : y + 15);
      });
    }

    // ===== Main detection loop =====
    setInterval(() => {
      captureCanvas.width = video.videoWidth;
      captureCanvas.height = video.videoHeight;
      captureCtx.drawImage(video, 0, 0);
      const imageData = captureCanvas.toDataURL('image/jpeg', 0.5);

      const endpoint = mode === 'find_object' ? 'find_object' : mode;
      const body = mode === 'find_object'
        ? { image: imageData, target: target }
        : { image: imageData };

      fetch(`${BACKEND_URL}/${endpoint}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'ngrok-skip-browser-warning': 'true'
        },
        body: JSON.stringify(body)
      })
      .then(res => res.json())
      .then(data => {
        speak(data.message, data.urgent, data.primary_category, data.primary_steps);
        if (mode === 'detect') {
          drawBoxes(data.boxes || [], data.frame_w, data.frame_h);
        } else {
          overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
        }
      })
      .catch(err => {
        document.getElementById('status').innerText = "Fetch error: " + err.message;
      });
    }, 2000);

    // ===== Start listening on load =====
    window.onload = () => {
      initAlwaysListening();
    };
  </script>
</body>
</html>
